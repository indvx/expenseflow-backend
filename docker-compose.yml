services:
  api:
    build: .
    image: expenseflow-api:latest
    ports:
      - "${PORT:-8003}:${PORT:-8003}"
    env_file:
      - .env
    environment:
      - UVICORN_PORT=${PORT:-8003}
    volumes:
      - type: bind
        source: .
        target: /app/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --reload
